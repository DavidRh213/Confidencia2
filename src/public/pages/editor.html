<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Panel de editor - Crea y publica artículos en Confidencialidad.">
    <meta name="theme-color" content="#121212">
    <title>Panel de Editor - Confidencialidad</title>
    <link rel="stylesheet" href="/css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    <div id="header-container"></div>
    <main class="container" id="main-content" role="main">
        <div class="d-flex justify-between align-center mb-2 gap-1">
            <h1>Panel del Editor</h1>
            <div class="d-flex gap-1 w-100-mobile">
                <button class="btn btn-primary" onclick="document.getElementById('article-form').style.display='block'" aria-label="Crear nuevo artículo">+ Nuevo Artículo</button>
                <button class="btn" style="background:var(--secondary); color:#000;" onclick="document.getElementById('category-form').style.display='block'" aria-label="Crear nueva categoría">+ Nueva Categoría</button>
            </div>
        </div>

        <div id="category-form" class="card" style="display:none; margin-bottom: 2rem;">
            <h2>Nueva Categoría</h2>
            <form onsubmit="createCategoryAPI(event)" class="d-flex mt-1 gap-1" role="form" aria-label="Formulario para crear categoría">
                <input type="text" id="newCategoryName" placeholder="Nombre de la categoría" required style="flex:1;" aria-label="Nombre de la categoría">
                <button type="submit" class="btn btn-primary" aria-label="Guardar categoría">Guardar</button>
                <button type="button" class="btn btn-danger" onclick="document.getElementById('category-form').style.display='none'" aria-label="Cancelar creación de categoría">Cancelar</button>
            </form>
        </div>

        <div id="article-form" class="card" style="display:none; margin-bottom: 2rem;">
            <h2>Escribir Artículo</h2>
            <form id="createArticleForm" onsubmit="createArticle(event)" role="form" aria-label="Formulario de creación de artículo">
                <fieldset>
                    <legend style="display:none;">Información del artículo</legend>
                    <div class="form-group mt-1">
                        <label for="titulo">Título</label>
                        <input type="text" id="titulo" required aria-label="Título del artículo" aria-required="true">
                    </div>
                    <div class="form-group">
                        <label for="id_categoria">Categoría</label>
                        <select id="id_categoria" aria-label="Categoría del artículo"></select>
                    </div>
                    <div class="form-group">
                        <label for="imagen">URL Imagen</label>
                        <input type="text" id="imagen" aria-label="URL de la imagen del artículo">
                    </div>
                    <div class="form-group">
                        <label for="introduccion">Introducción</label>
                        <textarea id="introduccion" rows="2" aria-label="Introducción del artículo"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="contenido">Contenido (Markdown/HTML)</label>
                        <textarea id="contenido" rows="10" required aria-label="Contenido completo del artículo" aria-required="true"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" aria-label="Guardar y publicar artículo">Guardar Publicación</button>
                    <button type="button" class="btn btn-danger" onclick="document.getElementById('article-form').style.display='none'" aria-label="Cancelar creación de artículo">Cancelar</button>
                </fieldset>
            </form>
        </div>

        <div class="card">
            <h2>Artículos Creados</h2>
            <div class="table-responsive">
                <table class="mt-1" role="grid" aria-label="Tabla de artículos creados">
                    <thead>
                        <tr role="row">
                            <th role="columnheader">Título</th>
                            <th role="columnheader">Categoría</th>
                            <th role="columnheader">Fecha</th>
                            <th role="columnheader">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="articles-tableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/editor.js"></script>
    <script>
        fetch('/pages/header.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('header-container').innerHTML = html;
                checkAuth().then(user => {
                    requireRole([1, 3]); // Admin & Editor allowed
                    loadEditorData();
                });
            });
    </script>
</body>
</html>
