<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Crea tu cuenta en Confidencialidad para acceder a nuestro blog de artículos.">
    <meta name="theme-color" content="#121212">
    <title>Crear Cuenta - Confidencialidad</title>
    <link rel="stylesheet" href="/css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    <div id="header-container"></div>
    <main class="container" id="main-content" role="main">
        <div class="card" style="max-width: 400px; margin: 2rem auto;">
            <h1 class="text-center mb-2">Crear Cuenta</h1>
            <form id="registerForm" onsubmit="handleRegister(event)" role="form" aria-label="Formulario de registro">
                <fieldset>
                    <legend style="display:none;">Información para registro</legend>
                    <div class="form-group">
                        <label for="Nombre">Nombre Completo</label>
                        <input type="text" id="Nombre" required aria-required="true" aria-label="Tu nombre completo">
                    </div>
                    <div class="form-group">
                        <label for="Email">Correo Electrónico</label>
                        <input type="email" id="Email" required aria-required="true" aria-label="Tu correo electrónico">
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" required aria-required="true" aria-label="Tu contraseña">
                    </div>
                    <div class="form-group mb-2">
                        <label for="passwordConfirm">Confirmar Contraseña</label>
                        <input type="password" id="passwordConfirm" required aria-required="true" aria-label="Confirma tu contraseña">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;" aria-label="Crear mi cuenta">Registrarse</button>
                </fieldset>
            </form>
            <div class="text-center mt-2">
                <a href="/pages/login.html" aria-label="Ir a la página de inicio de sesión">¿Ya tienes cuenta? Inicia sesión</a>
            </div>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/register.js"></script>
    <script>
        fetch('/pages/header.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('header-container').innerHTML = html;
                checkAuth();
            });
    </script>
</body>
</html>
