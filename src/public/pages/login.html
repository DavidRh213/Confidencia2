<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Inicia sesión en Confidencialidad para acceder a tu cuenta y explorar nuestros artículos.">
    <meta name="theme-color" content="#121212">
    <title>Iniciar Sesión - Confidencialidad</title>
    <link rel="stylesheet" href="/css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    <div id="header-container"></div>
    <main class="container" id="main-content" role="main">
        <div class="card" style="max-width: 400px; margin: 2rem auto;">
            <h1 class="text-center mb-2">Iniciar Sesión</h1>
            <form id="loginForm" onsubmit="handleLogin(event)" role="form" aria-label="Formulario de inicio de sesión">
                <fieldset>
                    <legend style="display:none;">Credenciales de acceso</legend>
                    <div class="form-group">
                        <label for="Email">Correo Electrónico</label>
                        <input type="email" id="Email" required aria-required="true" aria-label="Tu correo electrónico">
                    </div>
                    <div class="form-group mb-2">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" required aria-required="true" aria-label="Tu contraseña">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;" aria-label="Ingresar a tu cuenta">Ingresar</button>
                </fieldset>
            </form>
            <div class="mt-2 text-center" style="font-size:0.9rem;">
                <p><a href="#" onclick="forgotPassword()" style="color:var(--secondary);" aria-label="Recuperar contraseña">¿Olvidaste tu contraseña?</a></p>
                <p class="mt-1">¿Aún no tienes cuenta? <a href="/pages/register.html" style="color:var(--primary);" aria-label="Ir a la página de registro">Regístrate aquí</a></p>
            </div>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/login.js"></script>
    <script>
        fetch('/pages/header.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('header-container').innerHTML = html;
                checkAuth(); // Verifica logueo y ajusta header
            });
    </script>
</body>
</html>
